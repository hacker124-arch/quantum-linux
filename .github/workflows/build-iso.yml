
name: Build Quantum Linux ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common syslinux-utils dosfstools mtools debian-archive-keyring

      - name: Build ISO
        run: |
          chmod +x auto/config config/hooks/normal/*.hook.chroot
          sudo lb clean --purge || true
          sudo ./auto/config
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: quantum-linux-iso
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
