
name: Quantum Linux ISO Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantum-linux-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Quantum Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f auto/config
          test -x auto/config

          echo "Configuration script found."

      - name: Show runner capacity
        run: |
          df -h
          free -h
          nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rsync \
            git \
            curl \
            wget \
            ca-certificates \
            gnupg \
            zstd \
            cpio \
            file

      - name: Verify live-build
        run: |
          set -euo pipefail
          lb --version
          debootstrap --version
          mksquashfs -version
          xorriso -version

      - name: Configure Debian Live
        shell: bash
        run: |
          set -euo pipefail
          sudo lb config

      - name: Validate generated configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f config/binary
          test -f config/bootstrap

          echo "Generated live-build configuration:"
          sudo grep -E '^(LB_DISTRIBUTION|LB_MODE|LB_ARCHITECTURES|LB_INIT_SYSTEM)=' \
            config/bootstrap config/binary || true

      - name: Build ISO
        shell: bash
        timeout-minutes: 320
        run: |
          set -euo pipefail

          sudo lb build 2>&1 | tee quantum-build.log

      - name: Verify ISO and generate SHA256SUMS
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          ISO=$(find . -type f -name '*.iso' \
            -not -path './.git/*' \
            -not -path './output/*' \
            -print -quit)

          if [ -z "$ISO" ]; then
            echo "::error::No ISO was generated."
            exit 1
          fi

          sudo cp "$ISO" output/Quantum-Linux.iso
          sudo chown "$USER:$USER" output/Quantum-Linux.iso

          cd output
          sha256sum Quantum-Linux.iso > SHA256SUMS

          ls -lh
          cat SHA256SUMS

      - name: Upload Quantum Linux ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Quantum-Linux-ISO
          path: |
            output/Quantum-Linux.iso
            output/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Quantum-Linux-Build-Logs
          path: |
            quantum-build.log
          if-no-files-found: ignore
          retention-days: 7
