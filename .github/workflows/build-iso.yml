
name: Build Quantum Linux ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "auto/**"
      - "config/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Quantum Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            rsync \
            curl \
            wget \
            git

      - name: Validate Quantum Linux configuration
        shell: bash
        run: |
          set -e

          test -f auto/config
          test -f config/package-lists/quantum.list.chroot

          grep -q -- "--distribution trixie" auto/config

          sed -i '/^[[:space:]]*live-installer[[:space:]]*$/d' \
            config/package-lists/quantum.list.chroot

          echo "Configuration validated."

      - name: Patch Debian Contents URL
        shell: bash
        run: |
          set -e

          SCRIPT="/usr/lib/live/build/lb_chroot_linux-image"

          if [ ! -f "$SCRIPT" ]; then
            SCRIPT="/usr/share/live/build/lb_chroot_linux-image"
          fi

          if [ ! -f "$SCRIPT" ]; then
            echo "ERROR: Cannot locate lb_chroot_linux-image"
            exit 1
          fi

          echo "Patching: $SCRIPT"

          sudo sed -i \
            's|/dists/${LB_PARENT_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz|/dists/${LB_PARENT_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz|g' \
            "$SCRIPT"

          sudo sed -i \
            's|/dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz|/dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz|g' \
            "$SCRIPT"

          echo "Checking patched URLs..."

          grep -n "Contents-" "$SCRIPT"

          if grep -qE '/dists/\$\{LB_(PARENT_)?DISTRIBUTION\}/Contents-' "$SCRIPT"; then
            echo "ERROR: Old broken Contents URL remains."
            exit 1
          fi

          echo "Contents URL patch successful."

      - name: Clean previous build
        shell: bash
        run: |
          sudo lb clean --purge || true

      - name: Configure Debian Trixie
        shell: bash
        run: |
          set -e

          sudo lb config noauto \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap https://deb.debian.org/debian/ \
            --mirror-chroot https://deb.debian.org/debian/ \
            --mirror-binary https://deb.debian.org/debian/ \
            --apt-recommends false \
            --apt-options "--yes -oAcquire::Retries=3" \
            --security false \
            --iso-application "Quantum Linux" \
            --iso-volume "QUANTUM_LINUX" \
            --bootappend-live "boot=live components quiet splash"

      - name: Build Quantum Linux ISO
        shell: bash
        run: |
          set -e

          sudo lb build

      - name: Find generated ISO
        if: always()
        shell: bash
        run: |
          echo "Searching for ISO files..."

          find . -type f -name "*.iso" -ls || true

      - name: Upload Quantum Linux ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Quantum-Linux-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
