name: Build Quantum Linux ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "auto/**"
      - "config/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Quantum Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            rsync \
            curl \
            wget \
            git

      - name: Validate Quantum Linux configuration
        shell: bash
        run: |
          set -e

          test -f auto/config
          test -f config/package-lists/quantum.list.chroot

          echo "Checking Debian Trixie configuration..."
          grep -q -- "--distribution trixie" auto/config

          # Remove live-installer if present:
          # it is not a normal desktop package.
          sed -i '/^[[:space:]]*live-installer[[:space:]]*$/d' \
            config/package-lists/quantum.list.chroot

      - name: Clean previous build
        shell: bash
        run: |
          sudo lb clean --purge || true

      - name: Configure Debian Trixie Live Build
        shell: bash
        run: |
          set -e

          sudo lb config noauto \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free-firmware" \
            --apt-recommends false \
            --apt-options "--yes -oAcquire::Retries=3" \
            --security false \
            --iso-application "Quantum Linux" \
            --iso-volume "QUANTUM_LINUX" \
            --bootappend-live "boot=live components quiet splash"

      - name: Build ISO
        shell: bash
        run: |
          set -e
          sudo lb build

      - name: List generated ISO files
        if: always()
        shell: bash
        run: |
          find . -maxdepth 2 -type f -name "*.iso" -ls || true

      - name: Upload Quantum Linux ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Quantum-Linux-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
