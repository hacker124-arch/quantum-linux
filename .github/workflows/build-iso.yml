
name: Quantum Linux XFCE ISO Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantum-linux-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Quantum Linux XFCE
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify repository files
        shell: bash
        run: |
          set -euo pipefail
          test -x auto/config
          test -f assets/quantum-symbol.png

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            live-build debootstrap squashfs-tools xorriso \
            isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin \
            mtools dosfstools rsync git curl wget ca-certificates \
            gnupg zstd cpio file \
            xfce4 xfce4-goodies xfce4-whiskermenu-plugin \
            xfce4-terminal xfce4-panel xfce4-session \
            xfce4-settings xfce4-appfinder thunar thunar-volman \
            tumbler mousepad ristretto \
            lightdm lightdm-gtk-greeter \
            network-manager network-manager-gnome \
            pavucontrol pipewire pipewire-pulse wireplumber \
            gvfs gvfs-backends \
            fonts-liberation fonts-noto firefox-esr \
            plymouth plymouth-themes \
            python3 python3-tk python3-pil python3-pil.imagetk \
            python3-cairosvg \
            sudo systemd initramfs-tools

      - name: Create XFCE package list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p config/package-lists
          cat > config/package-lists/quantum-xfce.list.chroot <<'EOF'
          xfce4
          xfce4-goodies
          xfce4-whiskermenu-plugin
          xfce4-terminal
          thunar
          thunar-volman
          tumbler
          mousepad
          ristretto
          lightdm
          lightdm-gtk-greeter
          network-manager
          network-manager-gnome
          pavucontrol
          pipewire
          pipewire-pulse
          wireplumber
          gvfs
          gvfs-backends
          firefox-esr
          plymouth
          plymouth-themes
          python3
          python3-tk
          python3-pil
          python3-cairosvg
          sudo
          EOF

      - name: Create Quantum boot logo theme
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p config/includes.chroot/usr/share/plymouth/themes/quantum
          mkdir -p config/hooks/live

          cp assets/quantum-symbol.png \
            config/includes.chroot/usr/share/plymouth/themes/quantum/watermark.png

          cat > config/includes.chroot/usr/share/plymouth/themes/quantum/quantum.plymouth <<'EOF'
          [Plymouth Theme]
          Name=Quantum Linux
          Description=Quantum Linux boot logo
          ModuleName=two-step

          [two-step]
          ImageDir=/usr/share/plymouth/themes/spinner
          DialogHorizontalAlignment=.5
          DialogVerticalAlignment=.82
          TitleHorizontalAlignment=.5
          TitleVerticalAlignment=.45
          WatermarkHorizontalAlignment=.5
          WatermarkVerticalAlignment=.5
          WatermarkVerticalAlignment=0.5
          WatermarkImage=/usr/share/plymouth/themes/quantum/watermark.png
          EOF

          cat > config/hooks/live/0990-quantum-plymouth.hook.chroot <<'EOF'
          #!/bin/sh
          set -e

          if [ -d /usr/share/plymouth/themes/spinner ]; then
            update-alternatives --install \
              /usr/share/plymouth/themes/default.plymouth \
              default.plymouth \
              /usr/share/plymouth/themes/quantum/quantum.plymouth 100

            update-alternatives --set default.plymouth \
              /usr/share/plymouth/themes/quantum/quantum.plymouth || true
          fi

          if command -v update-initramfs >/dev/null 2>&1; then
            update-initramfs -u -k all || true
          fi
          EOF

          chmod +x config/hooks/live/0990-quantum-plymouth.hook.chroot

      - name: Install Iconn Manager
        shell: bash
        run: |
          set -euo pipefail

          APP="config/includes.chroot/usr/local/bin/iconn-manager"
          mkdir -p "$(dirname "$APP")"

          cat > "$APP" <<'PYTHON'
          #!/usr/bin/python3
          import os
          import shutil
          import subprocess
          import tkinter as tk
          from tkinter import filedialog, messagebox
          from PIL import Image, ImageTk

          TARGET = "/usr/share/plymouth/themes/quantum/watermark.png"
          DEFAULT = "/usr/share/plymouth/themes/quantum/default-watermark.png"
          SUPPORTED = (
              ".png", ".jpg", ".jpeg", ".bmp", ".webp",
              ".gif", ".tif", ".tiff"
          )

          class IconnManager:
              def __init__(self, root):
                  self.root = root
                  root.title("Iconn Manager")
                  root.geometry("480x420")
                  root.configure(bg="#171329")

                  tk.Label(
                      root, text="Iconn Manager",
                      font=("Arial", 22, "bold"),
                      fg="#c5a5ff", bg="#171329"
                  ).pack(pady=18)

                  tk.Label(
                      root, text="Change your Quantum Linux boot logo",
                      fg="white", bg="#171329"
                  ).pack()

                  self.preview = tk.Label(root, bg="#241d3d")
                  self.preview.pack(pady=20, ipadx=35, ipady=25)

                  tk.Button(
                      root, text="Choose Image",
                      command=self.choose, width=24
                  ).pack(pady=6)

                  tk.Button(
                      root, text="Apply Boot Logo",
                      command=self.apply, width=24
                  ).pack(pady=6)

                  tk.Button(
                      root, text="Restore Default Logo",
                      command=self.restore, width=24
                  ).pack(pady=6)

                  self.path = None
                  self.image = None

              def choose(self):
                  path = filedialog.askopenfilename(
                      filetypes=[
                          ("Supported images", "*.png *.jpg *.jpeg *.bmp *.webp *.gif *.tif *.tiff"),
                          ("All files", "*.*")
                      ]
                  )
                  if not path:
                      return

                  try:
                      image = Image.open(path).convert("RGBA")
                      image.thumbnail((180, 180))
                      self.image = image
                      self.path = path
                      preview = ImageTk.PhotoImage(image)
                      self.preview.configure(image=preview)
                      self.preview.image = preview
                  except Exception as error:
                      messagebox.showerror("Image error", str(error))

              def privileged(self, source):
                  script = (
                      "install -m 644 "
                      + "'" + source.replace("'", "'\\''") + "' "
                      + "'" + TARGET + "' && "
                      + "update-initramfs -u -k all"
                  )
                  result = subprocess.run(["pkexec", "sh", "-c", script])
                  if result.returncode == 0:
                      messagebox.showinfo(
                          "Iconn Manager",
                          "Boot logo updated. The boot animation was not changed."
                      )

              def apply(self):
                  if self.image is None:
                      messagebox.showwarning("Iconn Manager", "Choose an image first.")
                      return
                  temporary = "/tmp/quantum-new-logo.png"
                  self.image.save(temporary, "PNG")
                  self.privileged(temporary)

              def restore(self):
                  if not os.path.exists(DEFAULT):
                      messagebox.showerror(
                          "Iconn Manager", "Default logo backup is missing."
                      )
                      return
                  self.privileged(DEFAULT)

          root = tk.Tk()
          IconnManager(root)
          root.mainloop()
          PYTHON

          chmod 755 "$APP"

          mkdir -p config/includes.chroot/usr/share/applications
          cat > config/includes.chroot/usr/share/applications/iconn-manager.desktop <<'EOF'
          [Desktop Entry]
          Name=Iconn Manager
          Comment=Change the Quantum Linux boot logo
          Exec=iconn-manager
          Icon=preferences-desktop-theme
          Terminal=false
          Type=Application
          Categories=Settings;System;
          EOF

      - name: Preserve default logo for restore
        shell: bash
        run: |
          set -euo pipefail
          cp assets/quantum-symbol.png \
            config/includes.chroot/usr/share/plymouth/themes/quantum/default-watermark.png

      - name: Configure Debian Live
        shell: bash
        run: |
          set -euo pipefail
          sudo lb config

      - name: Validate Debian configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f config/binary
          test -f config/bootstrap
          grep -q 'trixie' auto/config
          echo "Debian 13 Trixie configuration verified."

      - name: Build ISO
        shell: bash
        timeout-minutes: 320
        run: |
          set -o pipefail
          sudo lb build 2>&1 | tee quantum-build.log

      - name: Verify ISO and generate checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          ISO="$(find . -type f -name '*.iso' \
            -not -path './.git/*' \
            -not -path './output/*' -print -quit)"

          test -n "$ISO"
          sudo cp "$ISO" output/Quantum-Linux-XFCE.iso
          sudo chown "$USER:$USER" output/Quantum-Linux-XFCE.iso

          cd output
          sha256sum Quantum-Linux-XFCE.iso > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Quantum-Linux-XFCE-ISO
          path: |
            output/Quantum-Linux-XFCE.iso
            output/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Quantum-Linux-Build-Logs
          path: quantum-build.log
          if-no-files-found: ignore
          retention-days: 7
